services:
  jobforge:
    build: .
    ports:
      - "7070:7070"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
      - ./cv.md:/app/cv.md
      - ./cv-structured.json:/app/cv-structured.json
    environment:
      - JOBFORGE_DOCKER=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
